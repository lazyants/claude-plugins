# .claude/literary-translator/profile.yml
profile_version: 1                      # skill refuses unknown versions

project:
  title: "YOUR BOOK TITLE HERE"           # e.g. a real project's title: "Les Historiettes de Tallemant des Réaux, tome 3"
  durable_root: "/ABS/PATH/TO/YOUR_PROJECT"   # NOT scratchpad -- e.g. a real project: "/Users/you/dev/your-book-project"
                                          # profile_validate.py FATALLY REJECTS this literal placeholder string --
                                          # Step 0 cannot pass until this is replaced with a real path.
  durable_root_adopt_existing: false     # Optional, defaults false/absent. Step 0a's ownership-marker check
                                          # halts with an ADOPTION PROMPT, not a fatal error, when durable_root
                                          # already contains a generic managed-directory name (segments/, scripts/,
                                          # out/, etc.) with no plugin marker inside it -- a plausible, normal book
                                          # project's own unrelated folder, not necessarily a conflict. Set this to
                                          # true, explicitly, ONLY after confirming the existing directory is safe
                                          # for this plugin to also write into.
  pipeline_version: v1                   # bump on ANY schema/prompt/role change -> invalidates ledger cache
  max_segment_words: 15000               # FATAL preflight: extraction halts, naming the offending
                                          # segment(s), if any segment's word_count exceeds this -- v1 has NO
                                          # sub-chunking. v1's actual scope is works whose NATURAL segment/chapter
                                          # boundaries already fit under this cap -- a novel with
                                          # genuinely long natural chapters that exceed it is OUT OF SCOPE for v1,
                                          # not a "pre-split it yourself" quick fix; see the `custom` adapter for
                                          # the principled escape hatch (a co-designed extractor performing an
                                          # author-approved chapter split before this plugin ever sees the text).
                                          # Default is generous relative to a typical novella-scale chapter --
                                          # raise or lower per project, but never silently overflow.

source:
  format: gutenberg_epub                 # gutenberg_epub | plain_text | custom -- gutenberg_epub is the only
                                          # WORKING extractor; plain_text is SPECIFIED but not yet implemented
                                          # (#62) -- selecting it fails FATALLY at W2 today, see the note on its
                                          # adapter_config block below; custom is supported/experimental
                                          # (expert-mode, a co-designed extractor -- see custom.md).
  path: "/ABS/PATH/TO/YOUR_SOURCE.epub"  # profile_validate.py FATALLY REJECTS this literal placeholder too --
                                          # e.g. a real project: "/Users/you/Downloads/YourBook.epub". REQUIRED and
                                          # existence-checked for EVERY format, including `custom` -- for a `custom`
                                          # source consuming more than one file, this is the PRIMARY/representative
                                          # input (Step 0's own sanity anchor); the co-designed extractor's own
                                          # `manifest.json` `source_inputs[]` is the authoritative FULL file list,
                                          # which may include more than this one path -- see custom.md.
  gutenberg_id: null                     # optional, gutenberg_epub only -- set the real Gutenberg ebook ID if known
  language:
    code: fr                             # ISO-639-1, source language
    particle_config: "fr.json"           # BARE FILENAME ONLY, resolved as ${durable_root}/languages/<value> --
                                          # e.g. this resolves to ${durable_root}/languages/fr.json, copied there
                                          # by Step 0a (NOT assets/languages/, which is inside the plugin install
                                          # dir and may not be reachable at runtime). Never include a "languages/"
                                          # prefix here -- the resolution base already supplies that segment.
                                          # A project-local override (e.g. after a failed smoke test) lives in
                                          # this same ${durable_root}/languages/ directory, under a
                                          # DIFFERENT filename Step 0a never copies over (e.g. "fr.local.json").
                                          # This value must be a simple alphanumeric/dot/underscore/hyphen filename
                                          # ending in .json -- no path separators, no "..", no absolute path;
                                          # profile_validate.py fatally rejects any value that violates this,
                                          # naming the field.
                                          # `has_elision` (article-fusion handling, e.g. French `d'X`/`l'X`) is NOT
                                          # a profile field -- it lives in the resolved particle_config file itself
                                          # (${durable_root}/languages/<value>), which is the sole source of truth
                                          # for this and every other language-specific behavior. To change whether
                                          # a language elides, edit that file directly (or fork a `.local.json`
                                          # override).
    smoke_test:
      # Any NEW language preset -- even the proven, unmodified `fr.json` -- requires its own smoke test the FIRST
      # time it's used against a NEW source. `fr.json` is proven against Historiettes' own 17th-c. orthography and
      # vocabulary specifically, not against French prose in general -- reusing it for a different book still
      # requires a fresh smoke-test pass. The gate is keyed to a TRIPLE: this exact particle_config's content, this
      # exact project's own extracted-source-text sample, and the generating script's own identity, so a stale
      # report from an older script version or a different book's sample is never silently trusted. Only an EXACT
      # repeat run against the identical sample, config, and currently-installed script version (e.g. a
      # resumed/re-run session on the same project, no plugin update in between) can reuse a prior report.
      report_path: null
        # Path to a written smoke-test report proving the triple above matches. All hashing/comparison is
        # procedural, evaluated at W3 (after extraction produces manifest.json) -- Step 0 only validates this
        # field's SHAPE (a string or null). `null` means: derive `${project.durable_root}/runs/language-smoke-report.json`
        # fresh, every run -- nothing to persist. A project may instead set an explicit string here for a
        # non-default location; when set, it MUST be a bare path starting with "runs/" and containing no ".."
        # segment -- profile_validate.py fatally rejects any value that violates this.
  adapter_config:
    # Only the sub-block matching `source.format` is meaningful; the others are ignored -- safe to leave them
    # populated (as this example does, for illustration) or blanked to null. Whichever format is NOT active, its
    # own sub-block is validated for basic shape only, never its specialized rules -- those only become
    # load-bearing once that format is genuinely selected.
    gutenberg_epub:
      spine_overrides: {}       # optional: {"<file>": "body|footnote-defs|front-back"} per-file classification override
      frontback_overrides: {}  # optional: {"<FRONTBACK id>": "translate|regenerate|omit"} per-element decision override
    plain_text:
      # FORWARD-SPEC (#62): plain_text extraction is not yet implemented --
      # selecting `source.format: plain_text` fails FATALLY at W2 until #62
      # lands. The fields below document the intended shape only.
      segmentation:
        method: blank_line_run  # blank_line_run | heading_regex
        blank_line_threshold: 2 # blank_line_run only -- REQUIRED, a positive integer, when this method is active
        heading_regex: null     # heading_regex only -- REQUIRED, a compilable regex, when this method is active
      verse_detection: CHOOSE_none_confirmed_or_regex
        # Ships as an intentionally INVALID placeholder -- Step 0 fatally rejects it until you consciously replace
        # it with `none_confirmed` (this source has no verse) or `regex` (verse_regex below detects it). You MUST
        # replace this CHOOSE_ sentinel EVEN while a different format is active (as in this example, where
        # `plain_text` is inert): profile_validate.py's Step-0 placeholder scan rejects any surviving CHOOSE_
        # value anywhere in the profile regardless of `source.format`, by design -- the schema's enum check is
        # format-gated, so this scan is the format-agnostic backstop. Set it to a valid value (e.g.
        # `none_confirmed`) even though it is unused here; the enum's own legality and coupling rules (which
        # value is legal, whether verse_regex is required) only become load-bearing once you actually select
        # `source.format: plain_text`.
      verse_regex: null
        # Only meaningful, and then REQUIRED, when verse_detection: regex; ignored (must stay null) for
        # none_confirmed.
      footnotes: CHOOSE_none_confirmed_or_markdown_ref_or_custom_regex
        # Ships as an intentionally INVALID placeholder, identical discipline to verse_detection above. Replace
        # with `none_confirmed` (no footnotes), `markdown_ref` (standard `[^N]` + trailing endnote list), or
        # `custom_regex` (footnote_anchor_regex/footnote_def_regex below define your own convention) -- whichever
        # this source's own text genuinely calls for.
      footnote_anchor_regex: null   # required (and only meaningful) when footnotes: custom_regex
      footnote_def_regex: null      # required (and only meaningful) when footnotes: custom_regex
    custom:
      extractor_path: null
        # Only meaningful when `source.format: custom`. Path (relative to durable_root) to the hand-crafted Python
        # extractor this project co-designs with the skill (Step 0c, custom.md). `null` means co-design
        # hasn't happened yet -- Step 0c halts and starts that conversation; a non-null value must resolve to an
        # existing file under `${durable_root}/scripts/custom_extractors/<value>` (a bare relative filename, no
        # ".." segment, no absolute path -- e.g. `extractor_path: "my_book_extractor.py"`). The co-designed script
        # must produce a `manifest.json` matching every other adapter's exact output shape and pass the same
        # round-trip self-checks.

target:
  language:
    code: ru                             # ISO-639-1, target language
    register_notes: "ты/вы politeness distinction — see style_bible.md section B"
    # target languages without an analogous register axis (e.g. English) leave this
    # informational; style_bible.md section B says "if not applicable, delete this section"

verse_policy:
  mode: full_rhymed_plus_literal
    # full_rhymed_plus_literal | full_rhymed_only | rhythmic_approximation |
    # mixed_by_length | literal_only | skip   -- see references/verse-policy.md
  threshold_lines: null
    # REQUIRED (fatal at Step 0 if null/absent) only when mode: mixed_by_length;
    # ignored (must stay null) for every other mode -- nested under verse_policy so
    # the mode<->threshold coupling is structurally visible, not two independent
    # top-level keys a profile author could set inconsistently.

engine:
  # translator and reviewer are HARDCODED to codex in every shipped template
  # (translate_TASK.template.md, review_TASK.template.md,
  # mass-translate-wf.template.js) -- codex is the sole translate/review engine,
  # launched by the shipped detached codex_job.py driver (1.4.7), not the old
  # codex:codex-rescue forwarder; this is NOT a configurable swap point in v1.
  # The whole schema-validated, codex-only-translates/codex-only-reviews design is
  # load-bearing on that specific engine's behavior; letting a profile silently
  # point elsewhere would reintroduce exactly the failure mode this methodology
  # was built to eliminate.
  effort: high
    # low | medium | high | xhigh -- the accuracy-bearing effort tier. Excludes none/minimal (nonsensical for
    # accuracy work) and max (codex-companion's --effort flag throws "Unsupported reasoning effort" on it). This
    # single value drives THREE carriers, always in sync (never independently pinned): for W5 translate/review the
    # codex_job.py driver passes it to codex as a real --effort <value> CLI flag (the plain-Claude dispatcher that
    # launches the driver runs at effort:'low' regardless -- it only dispatches, it never translates/reviews); the
    # glossary-pass codex batch call and the Claude fix step both read this same value as their own agent()
    # effort option. Does NOT apply to purely mechanical, no-judgment calls: the translator-readiness poll and the
    # ledger-bookkeeping call are both effort:'low' by design.
  # model: gpt-5.3-codex   # optional codex model for W5 translate/review; unset = codex config default
  max_fix_rounds: 4                       # cap before escalating to non_converged / blocked
  batch_agent_cap: 10000
    # A worst-case agent-call-count ESTIMATE for this batch is computed before dispatch begins -- if the
    # estimate for the given SEGS array would exceed this cap, the run refuses to start, logging the estimate
    # and the offending segment count. Splitting a batch that's too large into smaller ones is the operator's
    # call, not automated in v1.
    # Calibration (1.16.1/#348): a WAIT is no longer ONE agent call. The agent's Bash tool clamps any single
    # call at 600 s, so each of W5's two waits is spent as up to 8 bounded chunks plus one authoritative
    # non-polling re-check -- WAIT_CALLS = 9. Worst case is therefore
    # 1 + N*(8 + 2*WAIT_CALLS + max_fix_rounds*(8 + WAIT_CALLS)) = 1 + N*94 at the shipped max_fix_rounds:4.
    # The normal-round term is 8 because 1.68.0 (#607) added the fix-scope audit AND the one retry a
    # CONTINUING round may spend on it; it was 6 (per-segment 86) between #348 and #607, and 1 + N*38 before
    # #348. READ THE CONSEQUENCE BEFORE SIZING A BATCH: at 94 the shipped 10000 admits at most 106 segments
    # (1 + 106*94 = 9965); 107 would need 10059 and the run would refuse to start. That is down from 116 at
    # the pre-#607 per-segment 86 (1 + 116*86 = 9977). Raised to 10000 from 3500 (#409 step 2), which at
    # today's 94 would admit only 37 (1 + 37*94 = 3479) and admitted 40 at 86 (1 + 40*86 = 3441) -- i.e. an
    # ordinary book batch sat just under that ceiling, where before #348 the same batch carried ~2000 calls
    # of margin (1 + 40*38 = 1521). The knob is deliberately EXCLUDED from agent_config_hash (cache_key.py's
    # compute_agent_config_hash whitelists exactly effort/max_fix_rounds/model, with a dedicated negative
    # test in ledger_composite_key.test.py), so changing it invalidates NO converged segment. It is a
    # SUBST_FIELDS member, so it does need one fresh RUN_ID -- a re-dispatch, never a re-translate.
    # Raising it further is a deliberate operator decision, not something to discover mid-run.
    #
    # COUPLING, easy to miss (#402): `CODEX_DEADLINE_SEC` in the workflow template is marked "(tunable)",
    # but raising it raises WAIT_CALLS, which multiplies straight into the estimate above -- so a longer
    # deadline SILENTLY SHRINKS how many segments this same cap admits. The two knobs are not independent
    # even though they live in different files. If a batch starts refusing after you lengthened the
    # deadline, this is why; the refusal message names the estimate and the cap, but it cannot name the
    # deadline that moved the estimate.
    # Also read by the W3 glossary-pass preflight and (when enabled) the skeptic pass, reusing this one knob for
    # THREE consumers -- but the glossary estimate is mode-dependent.
    # offline (glossary.research_mode) -- 5*BATCHES.length + 2: basis:"established" is fatal offline,
    # so the pre-merge citation review has nothing to act on and never runs. live -- 19*BATCHES.length + 2, the
    # citation-review retry ladder: 1 + (3+WAIT_CALLS)*(MAX_CITATION_RETRIES+1) = 19 calls per batch at the
    # template's own shipped MAX_CITATION_RETRIES = 2 and WAIT_CALLS = 3. Substituting those, the live shape
    # spells out as 1 + 6*(MAX_CITATION_RETRIES+1) = 19, which is where an operator re-deriving it should land.
    # Size the cap for the LIVE ladder, or a live run refuses "batch-too-large".
    # ALL THREE GATES MOVED IN 1.16.2 -- read this table before sizing anything. #409 step 2 then raised the
    # SHIPPED CAP itself (3500 -> 10000, see above) without touching either formula below, so every max-batch
    # figure here scales by that same ~2.857x -- recomputed at the current cap of 10000:
    #
    #   gate                before      after      max batches (10000)
    #   glossary live       13N+2       19N+2       769 -> 526
    #   glossary offline     3N+2        5N+2      3332 -> 1999
    #   skeptic (both)       3N+2        5N+2      3332 -> 1999
    # "skeptic (both)" = the Workflow's own preflight AND skeptic_setup.py's independent step-5 assertion; they
    # must move together, since leaving one behind makes one refuse a batch the other admits.
    # The live per-attempt cost rose from 3 to 4 in 1.16.1 (#347): the single agent that both fetched citations
    # and judged them became a prepare call that retrieves without reading and a judge call that reads without
    # retrieving. Stated at its true width, narrower than an earlier draft of this note claimed: the judge is given
    # no retrieval INSTRUCTION and no fragment path, but it DOES receive URLs -- index.json's `source` field is the
    # cited URL itself, and a fetched body can contain any URL at all. What changed in 1.16.1 is that nothing in
    # its prompt asks it to fetch and every byte it judges arrived through fetch_citation.py's checks -- not that
    # URLs were kept away from it, and not that the tool was taken away. The tool went separately, in #353: the
    # judge now runs as the plugin agent literary-translator:citation-judge, granted `tools: Read` and nothing else.
    # Its prompt therefore marks those fields UNTRUSTED explicitly. That is a security boundary,
    # not extra work -- but it IS extra calls. The live per-batch term then rose again from 13 to 19 in 1.16.2
    # (#352), for an unrelated reason: not a new review step, but the WAIT itself becoming worth UP TO
    # WAIT_CALLS = 3 agent calls (2 bounded chunks of the same unchanged 900 s budget, plus one authoritative
    # non-polling re-check), multiplied by the retry ladder. The formula is a strict generalisation --
    # substitute WAIT_CALLS = 1 and it collapses to the 1.16.1 figures of 13 and 3.
    # THESE ARE CEILINGS, NOT RUNTIME COSTS -- a READY in any chunk ends the wait immediately AND suppresses
    # the re-check, so a real wait spends 1, 2 or 3 calls and a real run comes in under 19N+2 / 5N+2. That is
    # the correct thing for a preflight gate to compute; it is not a prediction of what the run will spend.
    # UPGRADE NOTE, AND IT IS WIDER THAN BEFORE: a live project whose cap was tuned near an earlier per-batch
    # figure will be refused at preflight with reason:"batch-too-large" -- loud and early rather than mid-run,
    # which is the intended direction, but it means the cap may need raising. Unlike the 1.16.0/1.16.1 moves,
    # 1.16.2's is NOT confined to the live ladder: the chunked wait can cost the same extra calls offline, so
    # the offline term moved 3 -> 5 too and an OFFLINE project's tuned cap can now start refusing as well.
    # THE PRINCIPLE BEHIND THE OLD "OFFLINE IS UNCHANGED" PROMISE IS UPHELD, NOT BROKEN, and the distinction is
    # what justifies the move: through 1.16.1 the offline REAL COST did not change, so charging offline projects
    # for the live ladder would have been a FALSE refusal -- a preflight that refuses runs it should permit is a
    # worse failure than one that is slightly loose. In 1.16.2 the wait can genuinely cost three calls in BOTH
    # modes, so 5N+2 is offline's true CEILING -- the same kind of quantity 3N+2 always was -- and refusing
    # against it is a correct refusal, not a false one. What must
    # never happen is a MODE-BLIND estimate charging offline the live 19N+2 for a ladder it cannot execute.
    # THIRD CONSUMER -- the skeptic pass (glossary.skeptic_pass.enabled) carries its own unconditional per-batch
    # term of precheck 1 + dispatch 1 + wait WAIT_CALLS == 5, i.e. 5*BATCHES.length + 2, moved from a flat 3 by
    # the same #352 change. Being opt-in and advisory does not exempt it: this is an OPERATOR-VISIBLE refusal
    # threshold moving under an existing cap, and skeptic_setup.py asserts the same number independently before
    # the Workflow starts, so an undersized cap refuses there first and writes nothing at all.
  max_codex_jobs_per_batch: 400
    # #409 stage 0. OPTIONAL, unlike batch_agent_cap above (many existing profiles predate this knob and must
    # stay schema-valid without it) -- when absent, the orchestrating session substitutes this schema field's
    # own documented "default": 400 into the template's {{MAX_CODEX_JOBS_PER_BATCH}} token, the same way
    # {{MODEL}} falls back to its own documented empty-string default when engine.model is unset. The gate
    # itself always runs regardless of where its value came from; the refusal message describes it as the
    # EFFECTIVE limit rather than claiming it was set by the operator, since the two cases (profile-set vs
    # schema-default) are byte-identical at instantiation time -- true either way, on purpose. A worst-case
    # CODEX-JOB-COUNT preflight,
    # independent of batch_agent_cap above. batch_agent_cap estimates Workflow agent() calls; this knob
    # estimates the OTHER consumable resource a
    # mass-translate batch spends: real codex dispatches (one detached codex_job.py launch per translate and
    # per review -- NOT per fix; see the per-segment count below). The refusal fires BEFORE the first job
    # launches, at the exact same preflight
    # site batch_agent_cap's own check sits at, so a batch too large for EITHER resource refuses before any work
    # starts, never mid-batch.
    #
    # Per segment, worst case (every round non-clean, so every fix round actually fires):
    #   1 translate job + (max_fix_rounds + 1) review jobs (one per normal round, plus the one mandatory final
    #   confirming review)
    #   = 1 + (max_fix_rounds + 1) = max_fix_rounds + 2.
    # The max_fix_rounds FIX rounds are deliberately NOT counted: the fix step is a plain Workflow agent() call
    # (callFix), never a codex_job.py launch. The template has exactly two launch sites, translate and review,
    # and a review round's retry path re-reads the artifact codex already wrote rather than dispatching again.
    # At the shipped max_fix_rounds: 4 that is 6 jobs/segment; a batch of N segments needs 6N codex jobs worst
    # case, so the shipped default of 400 admits 66 segments (66*6 = 396).
    # NOTE, so the two knobs are not mistaken for one envelope: they do NOT bind at the same batch size, and
    # WHICH ONE binds first depends on both shipped values, not fixed. #409 step 2 raised batch_agent_cap's
    # shipped default from 3500 to 10000 without touching this knob -- so THIS cap binds FIRST at every
    # shipped setting (its own 400 default admits 66 segments, below batch_agent_cap's 106 since #607, and
    # below the 116 it admitted before), the reverse of the pre-#409-step-2 relationship. This cap is
    # therefore no longer redundant with batch_agent_cap above for an ordinary book in the 67-106 segment
    # range: it is the gate that actually refuses first. Splitting a batch that's too large into
    # smaller ones is the operator's call, not automated in v1 (same policy as batch_agent_cap).

footnotes:
  apparatus_policy: translate_all
    # translate_all | preserve_source | omit_apparatus | body_refs_only
    # -- see references/source-format-adapters/ (each adapter defines its own
    # behavior for all four values) and references/engine-loop.md.
    # This project's choice: translate 100% of the 19th-c. critical apparatus too
    # (translate_all).

glossary:
  research_mode: CHOOSE_live_or_offline  # Ships as an intentionally INVALID placeholder.
                                          # REQUIRED, no default -- live | offline. The explicit, human-set
                                          # precondition for whether THIS run's glossary-pass codex agent actually
                                          # has working web/research access -- the orchestrating Claude session is
                                          # the only party that actually knows this about its own environment, so
                                          # it's a declared precondition, never something a script silently probes
                                          # and gets wrong. Under `offline`, basis:"established" is FATALLY
                                          # forbidden for every canon entry this run produces -- candidates that
                                          # would otherwise warrant it get basis:"transliterated" or are routed to
                                          # review_queue instead, tagged with a SOURCE_UNAVAILABLE: note. A
                                          # candidate needing basis:"sense_translated" (a deliberate,
                                          # project-specific sense-rendering of a speaking name -- see
                                          # style_bible.md section G) is unaffected either way: it never claims
                                          # a citable source, in live or offline mode alike. Replace
                                          # with `live` or `offline`, consciously, matching THIS run's own actual
                                          # environment.

  citation_content_types: []               # 1.16.1 (#347). OPTIONAL. Content-Type prefixes the citation fetcher may
                                          # admit. Empty list = the shipped default: text/, application/xhtml,
                                          # application/xml, application/json -- "a document a human could have
                                          # read", which is what a citation is supposed to be.
                                          # Set it when THIS corpus cites something the default excludes; the
                                          # motivating case is scanned archives, ["text/", "application/pdf"].
                                          # Note what widening costs: the judge then ingests bytes it cannot really
                                          # read as prose, so a PDF that is actually an image scan yields an
                                          # unreviewable "citation" the judge may still approve. Widen because the
                                          # corpus needs it, not to make refusals go away.
                                          # Each entry is a bare type/subtype PREFIX matched with startswith --
                                          # no parameters (`; charset=...`), no wildcards, no uppercase. A malformed
                                          # entry is refused at preflight by both the workflow template and
                                          # fetch_citation.py, never silently ignored.

validation:
  untranslated_sentinel: "нет перевода"
    # validate_draft.py reads THIS field rather than a hardcoded literal -- a target-language-
    # appropriate marker a translator agent uses/leaves behind for "not yet translated," which the false-green
    # gate scans for verbatim.
  forbidden_patterns: []
    # OPT-IN, default absent (#520). Your project's OWN deterministic style bans -- the plugin
    # ships none and hardcodes none, because a style contract lives in YOUR style_bible.md and
    # only you know which of its rules are codepoint-decidable. Each entry is an id/pattern/message
    # triple; `pattern` is a Python `re` pattern. final_audit.py (W7) tests every string leaf of a
    # converged draft's blocks/footnotes/verses against it and emits one advisory WARN line per
    # (segment, field, pattern) -- never a hard failure, never an exit-code change.
    #
    # The text is scanned EXACTLY as the translator wrote it: sentinels (⟦FNREF_1⟧, ⟦VERSE_v1⟧) are
    # NOT substituted out and markdown emphasis is NOT stripped. So a pattern that would only match
    # after a placeholder became a space will not fire, and one that matches inside a placeholder
    # will. Write the pattern against the draft, not against the rendered book.
    #
    # A pattern that fails to compile is reported as its own WARN naming the id -- never silently
    # skipped, so a rule you thought was enforced can never read as a clean run. That is the only
    # rejection W7 makes: everything about SHAPE -- a missing field, an unknown key, a bad id, a
    # dropped list dash -- is refused earlier, by profile_validate.py at Step 0. There is no
    # LIST-LENGTH cap and no execution-cost bound on a pattern: profile.yml is yours, on the same
    # trust footing as the scripts themselves. Individual fields ARE capped, and Step 0 refuses a
    # violation: `pattern` and `message` at 200 characters each, `id` at 64.
    #
    # Example -- a project whose own renderer prints a run of asterisks literally to the reader:
    #   forbidden_patterns:
    #     - id: adjacent-asterisks
    #       pattern: '\*{2,}'
    #       message: "two or more adjacent asterisks reach the reader verbatim -- separate the spans"
  admit_contract_only_stale: false
    # OPT-IN, default false (#533). Editing style_bible.md between the STYLE_CONTRACT markers moves
    # style_contract_hash, which flips EVERY already-converged segment to `stale` -- and both the W7
    # completeness gate and W9 assembly then refuse to ship until each flipped unit converges again.
    # R9 says such an edit applies FORWARD and owes no back-sweep; this field is how the tooling is
    # allowed to agree with it. Set to true and a flipped unit is admitted ONLY when all of: its
    # `.ever_converged` sentinel is not absent; its on-disk draft still matches the recorded
    # reviewed_draft_sha1 (so no prose changed, only the standard); and every other moved cache-key
    # field is machinery-only (plugin bytes, schema shape, derivation-bundle bytes). Any other moved
    # field -- the source text, the prompts, canon terms, engine or extraction config -- still refuses,
    # naming itself.
    # What it does NOT do: it never rewrites a ledger record and never stamps a hash. The record keeps
    # saying `stale`, and every admitted segment is named on stderr and in each gate's structured
    # stdout, so "these N units shipped without being judged against the current contract" is written
    # down. And it cannot tell an ADDITION from a REVERSAL: a rule you REVERSED actively demanded the
    # wrong choice in the segments already converged under it, and one global style_contract_hash
    # cannot distinguish the two cases. After a reversal, re-review rather than declaring this.
    # Keep the value stable from W7 through delivery -- final_audit.py, assemble.py,
    # validate_assembled.py and validate_conservation.py all read this same field, and toggling it
    # between those steps is the only way a NORMAL run can make them disagree about the same book.
    # (They take the moved-field list from different authorities: W7 from select_segments.py's
    # recomputation against the current cache key, the other three from the materialized
    # stale_mismatched_fields. ledger_merge.py drops any inherited value and re-derives that list
    # from the same diff, so they agree by construction on anything a run produces -- only a hand
    # edit of the materialized ledger.json between the steps can split them, and the same edit
    # could set status: converged, which skips both carve-outs outright.)

output:
  v1_scope: segment_drafts_and_audit
    # segment_drafts_and_audit | assembled_book -- the default, segment_drafts_and_audit, delivers converged
    # per-segment drafts + ledger + each draft's own validate_draft.py per-segment audit trail + a whole-book
    # final_audit.py summary/WARN report -- NOT a single assembled book file. destination below is where the
    # audit/handoff package (not a book) is written. Setting this to `assembled_book` is LOAD-BEARING: it turns
    # on Step 0d + W9 Assemble, which reconstruct the converged drafts into one rendered book via the
    # `target` adapter below (see references/assembly-and-output.md) -- gated on W7's project_complete: true.
  destination: "/ABS/PATH/TO/YOUR_PROJECT/out/"   # matches durable_root's placeholder above + /out/ (the default,
                                          # resolving inside durable_root); e.g. a real project:
                                          # "/Users/you/dev/your-book-project/out/"
  target: obsidian
    # obsidian | epub | custom -- which output-target adapter renders the assembled book; only ever consulted
    # when v1_scope: assembled_book. `obsidian` is the one target this increment actually ships and renders,
    # via scripts/render_obsidian.py -- a vault of narrative pages plus one cross-linked entity note per
    # canon.json entry. `epub` resolves (Step 0d validates the enum) but has no renderer behind it yet (see
    # references/assembly-and-output.md's "Why build_epub.py hasn't been generalized"). `custom` also resolves
    # but always requires this project to co-design its own renderer first (adapter_config.custom.renderer_path).
  name_display:
    parenthetical_originals: never
      # never | first_occurrence -- whether a name's original-script form is shown parenthetically alongside
      # its target-language rendering the first time it occurs. Only consulted by the obsidian adapter at
      # render time, i.e. only under v1_scope: assembled_book; inert under the default segment_drafts_and_audit.
  adapter_config:
    # Per-target settings for the assembler -- only the sub-block matching `target` above is meaningful;
    # the others sit inert. Field-level shape validation is real for obsidian/custom (see below); epub
    # stays intentionally loose (any object) until its own Phase ships.
    obsidian:
      folders: {}
        # Optional category -> folder catalog for entity-note placement (e.g. {"person": "people",
        # "place": "places", "work": "works"}) -- OPEN, per-project vocabulary declared here, NOT a
        # hardcoded schema enum (see references/output-target-adapters/obsidian.md for preset examples
        # to copy from). A category absent from this map (or left {} entirely, as here) routes to an
        # "other" folder -- never a hard failure.
        # The shipped glossary pass never asks for `category`, so a catalog declared here routes only
        # entries that already carry one, and everything else lands in "other". Read
        # canon-entry.schema.json's own `category` field before writing any gate that assumes the
        # field is populated; to populate it, ask for it in this project's own glossary prompt.
      mentions_section:
        enabled: true
          # ON BY DEFAULT (an absent mentions_section block, or an absent/null enabled key, all resolve
          # to enabled too -- this explicit block just keeps the shipped example self-documenting rather
          # than activating the feature by absence). Emits a source-anchored "## Mentions" occurrence
          # index in each entity note -- the authoritative, variant-immune, homonym-split occurrence index;
          # the advisory validate_backlinks.py W9 gate verifies its coverage. Collision de-linking (an
          # NFC-exact canonical_target_form shared by >=2 entries -- case-sensitive, so "Peter" vs "peter"
          # stay distinct single-owner targets -- never gets an inline link) now applies to every obsidian
          # render and is NOT governed by this flag. Set to false to opt out of the "## Mentions" section only
          # (byte-identical to pre-1.10.0 output except homonym collisions, which stay de-linked either
          # way). See references/output-target-adapters/obsidian.md.
    epub: null
    custom:
      renderer_path: null
        # Bare relative filename (no path separators beyond what's needed, no ".." segment, no leading
        # "/"), resolved as ${durable_root}/scripts/custom_renderers/<value>. Only meaningful when
        # target: custom. null means the custom renderer hasn't been co-designed yet --
        # output_resolve.py halts for that conversation rather than silently guessing.
  # future (v2+): bilingual-output layout logic (bilingual_epub | plain_text_master) is a plausible later
  # addition, but only once the `epub` target itself exists and renders (see
  # references/assembly-and-output.md's "Also out of scope for this increment").
