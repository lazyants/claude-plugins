name: cc-usage-coach

on:
  push:
    branches: [main]
    paths:
      - 'plugins/cc-usage-coach/**'
      - '.github/workflows/cc-usage-coach.yml'
  pull_request:
    paths:
      - 'plugins/cc-usage-coach/**'
      - '.github/workflows/cc-usage-coach.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Toolchain
        run: |
          python3 -V
          python3 -m pytest --version

      # The shipped runner, not a re-spelling of it: it is what the plugin's
      # README documents and it already maps a failing suite to a non-zero exit.
      - name: tests/run-all.sh
        working-directory: plugins/cc-usage-coach
        run: bash tests/run-all.sh
